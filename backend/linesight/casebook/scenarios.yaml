# LineSight casebook. EVERYTHING HERE IS SYNTHETIC.
# `visible` is what the engine receives. `hidden` drives the simulator and is never shown to the engine.
# Ground-truth labels live in truth.yaml, which the engine never imports.
# fixture: documented_mechanism_replay | adaptation_of_unresolved_report | fully_synthetic
defaults: &defaults
  now: "2026-11-09T06:40:00"

scenarios:
  # ------------------------------------------------------------------ flagship demos
  - id: demo-a-line-speed
    split: demo
    title: "It only fails at full line speed"
    fixture: documented_mechanism_replay
    sources: [S1, S5]
    station: plant-a-line3
    seed: 1101
    <<: *defaults
    visible:
      reporter: "Line 3 operator (ticket), relayed by maintenance technician"
      ticket: |
        Camera 3 keeps going offline. We restarted it twice. Can you send a replacement?
        Technician note: at low speed the line looks fine. At full speed images go missing and cartons get diverted to manual inspection.
      business_impact: "Line 3 diverting cartons to manual inspection at production speed; two operators re-checking labels."
      timeline:
        - {t: "2026-11-07T09:10:00", what: "Maintenance replaced edge PC (EH-200 → EH-310); inspection profile imported from installer defaults"}
        - {t: "2026-11-07T13:40:00", what: "Maintenance replaced PoE switch (NP-8G → NP-8L)"}
        - {t: "2026-11-07T16:00:00", what: "Low-speed test run (4 cartons/s): no diversions"}
        - {t: "2026-11-09T06:05:00", what: "Production start at 10 cartons/s"}
        - {t: "2026-11-09T06:12:00", what: "First diversions for missing images"}
        - {t: "2026-11-09T06:20:00", what: "Operator restarted Camera 3 (no change)"}
        - {t: "2026-11-09T06:31:00", what: "Operator restarted Camera 3 again (no change)"}
      prior_temporary_recoveries: 0
    hidden:
      faults: [{type: burst_contention, throughput_limit_mbps: 265}]

  - id: demo-b-replacement
    split: demo
    title: "The replacement camera is visible but cannot connect"
    fixture: documented_mechanism_replay
    sources: [S2]
    station: plant-a-line3
    seed: 1202
    <<: *defaults
    visible:
      reporter: "Plant A maintenance technician"
      ticket: |
        We fitted the replacement camera for Camera 3 that arrived Friday. It shows up in the camera list but the software won't connect to it. Line is running with Camera 3 inspection bypassed and a person checking batch codes by hand.
      business_impact: "Batch-code inspection (top) bypassed; manual check at 10 cartons/s is not sustainable past one shift."
      timeline:
        - {t: "2026-11-06T15:30:00", what: "Replacement Vireo GV-16M shipped from spares stock"}
        - {t: "2026-11-09T06:00:00", what: "Technician fitted replacement as Camera 3"}
        - {t: "2026-11-09T06:15:00", what: "Camera 3 visible in camera list; connection refused"}
      prior_temporary_recoveries: 0
    hidden:
      faults: [{type: adapter_mismatch, device: cam3, firmware: "5.0.2"}]

