      prior_temporary_recoveries: 3
    hidden:
      faults: [{type: heartbeat_lockout_unresolved, migrated_from: "EH-200 / Windows 10 IoT"}]
      changes_detail: "Edge PC replaced Saturday. Same cameras, same switch, same cables."

