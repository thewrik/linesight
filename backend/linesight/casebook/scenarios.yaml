# ------------------------------------------------------------------ paraphrase set
# Same hidden world and truth as the base scenario; only the ticket wording differs.
# Written after the lexicon parser was frozen and NOT used to tune it (see docs/evaluation.md).
paraphrases:
  demo-a-line-speed:
    - "Batch code cam on the top keeps blinking out on the HMI whenever we go up to full rate, slower it behaves. Two reboots, no joy. Ship us another camera?"
  demo-b-replacement:
    - "Swapped in the spare unit for station 3. We can see it in the device browser fine but opening it errors out."
  demo-c-heartbeat:
    - "Roughly sixty minutes after the line goes quiet, every camera stops answering. Bouncing the inspection software gets them back. New PC since Saturday."
  dev-cert:
    - "Quality says the plant screens have been blank for Line 3 cameras since the weekend, but production says inspection is running normally."
  dev-cable:
    - "Side batch-code camera gives us partial images even on the slow setting. Think it's had it, please replace."
  ho-unreleased-fw:
    - "Borrowed a demo camera from the sales team for position 3; it's listed on the network but the app refuses it."
  dev-plc-trigger:
    - "Back-label camera never fires since the PC swap; every carton fails that check."
  ho-identity:
    - "Since the new edge box went in, the MES tile for Line 2 is grey."
  ho-heartbeat-plantb:
    - "after the lunch break the cameras are all unreachable, a reboot of the app sorts it out until next time"
  dev-poe:
    - "Since it got cold, the side camera keeps resetting itself a few times a shift."
