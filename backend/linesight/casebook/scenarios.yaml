      timeline:
        - {t: "2026-11-07T09:10:00", what: "Edge PC migrated (EH-200 / Windows 10 → EH-310 / Windows 11)"}
        - {t: "2026-11-07T15:35:00", what: "Lockout after idle; operator restarted app"}
