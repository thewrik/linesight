- id: S5
  url: https://support.cognex.com/en/help-articles/the-acquisition-failed-abnormally-with-buffer-retrieve-failed-errors-on-acquisition
  title: "'The acquisition failed abnormally' with 'Buffer retrieve failed' errors (Cognex)"
  retrieved: 2026-11-07
  evidence_type: vendor_kb
  paraphrase: >
    Distinguishes error variants with a similar surface: consecutive-resend failures mean packets in
    the middle of a frame went missing; auto-abort means the tail of the frame did not arrive in time
    (which the driver cannot distinguish from a camera pausing). Both usually indicate bandwidth
    problems. Other 'acquisition failed' variants have different origins: register write errors
    (compatibility; decimal-comma locale), timing errors (compatibility/firewall), and image pool
    full (images too large or too many buffered).
  applicability: "Cognex software with the Pleora driver (article dated 2025-03-12). LineSight uses the distinction, not the product."
  documented_outcome: "Remedy checklist; no measured outcome."
  unresolved_questions: "Thresholds such as recommended packet size and receive buffers are product-specific."
  used_by: [H-BURST, H-HOST-BACKPRESSURE, H-LOCALE]
  fixture_relation: documented_mechanism_replay

- id: S6
  url: https://github.com/basler/pypylon/issues/863
  title: "GigE Cameras experience Heartbeat timeout after periods of inactivity (basler/pypylon #863)"
  retrieved: 2026-11-07
  evidence_type: public_issue
  paraphrase: >
    A user reports four PoE GigE cameras on software triggers that lock out after roughly an hour of
    inactivity following a move from a Windows 10 laptop to a Windows 11 mini PC. A packet capture
    shows heartbeat writes acknowledged until a gap of about 3.2 s, after which all cameras answer
    access-denied. The reporter planned a polling-interval change while noting it would not address
    the root cause.
  applicability: "One user's setup (pypylon 4.2.0, pylon 10.2.1, Windows 11 24H2). An observation, not a confirmed root cause."
  documented_outcome: "Open when read on 2026-11-07; no maintainer response or confirmed resolution visible."
  unresolved_questions: "Why the heartbeat gap appears after idle; whether host power management, timer behaviour or the SDK is involved."
  used_by: [H-HEARTBEAT-GAP, Demo C]
  fixture_relation: adaptation_of_unresolved_report
