- id: S1
  url: https://docs.baslerweb.com/knowledge/how-to-troubleshoot-lost-packets-or-frames-while-using-gige-cameras
  title: "How to: Troubleshoot Lost Packets or Frames While Using GigE Cameras (Basler)"
  retrieved: 2026-11-07
  evidence_type: vendor_kb
  paraphrase: >
    When several GigE cameras transmit at the same time (for example on a shared hardware trigger),
    the burst can temporarily overfill switch or NIC buffers. Suggested remedies: check lost
    packet/frame statistics, raise NIC receive descriptors and jumbo-frame size, lower interrupt
    moderation, keep packet size within the NIC limit, increase inter-packet delay until losses stop
    while still meeting the needed frame rate, and optionally add per-camera frame transmission delay.
  applicability: "GigE Vision cameras in general; NIC steps written for Windows; parameter names vary by model."
  documented_outcome: "Guidance article; no measured deployment outcome. Notes that a large inter-packet delay lowers the maximum frame rate."
  unresolved_questions: "No formula or numeric buffer sizes given; the article's example packet sizes are labelled ambiguously."
  used_by: [H-BURST, PB-PACING, case family burst_contention]
  fixture_relation: documented_mechanism_replay

- id: S2
  url: https://support.cognex.com/en/help-articles/in-sight-vision-suite-needs-the-correct-adapter-installed-for-connecting-a-device
  title: "In-Sight Vision Suite Needs the Correct Adapter Installed for Connecting a Device (Cognex)"
  retrieved: 2026-11-07
  evidence_type: vendor_kb
  paraphrase: >
    A device can appear in the network device list yet refuse a connection when the software lacks the
    adapter version that matches the device firmware. Fix by updating the device firmware to an
    installed version or installing the adapter that fits the firmware. Software and firmware version
    numbers are not the same scheme.
  applicability: "In-Sight Vision Suite devices (article dated 2024-09-15). LineSight models the mechanism with a fictional, authored matrix."
  documented_outcome: "Two documented remedies; no deployment measurement."
  unresolved_questions: "Real adapter/firmware pairings are not reproduced; LineSight's matrix is fictional."
  used_by: [H-ADAPTER, H-UNRELEASED-FW, PB-ADAPTER]
  fixture_relation: documented_mechanism_replay

- id: S3
  url: https://docs.baslerweb.com/troubleshooting
  title: "Troubleshooting (Basler pylon documentation) — entry on 'device is already connected' after a crash"
  retrieved: 2026-11-07
  evidence_type: vendor_docs
  paraphrase: >
    After an application crashes or is killed, restarting can fail because the camera keeps the old
    connection until the GigE Vision heartbeat timeout expires. The page says this typically occurs
    when debugging with pylon 7.0 or earlier; later versions close the connection automatically at
    program termination. Remedies: power-cycle or briefly disconnect the camera (also when the
    heartbeat timeout was increased); heartbeat control is described elsewhere in the docs.
  applicability: "Scoped to pylon <= 7.0 under a debugger. LineSight's fictional SDK models an analogous scope (SDK < 3.0 with debug heartbeat)."
  documented_outcome: "Behaviour documented as changed in later versions; no claim that every SDK behaves this way."
  unresolved_questions: "The exact heartbeat value used by debug builds is not stated on the page read."
  used_by: [H-STALE-LOCK, PB-RELEASE-LOCK, KI-KESTREL-LOCK-RETAIN]
  fixture_relation: documented_mechanism_replay

