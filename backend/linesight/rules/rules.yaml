# LineSight rule set. Validated by linesight/rules/loader.py at start-up.
# Changing a hypothesis, diagnostic or playbook here needs no prompt changes.
# The version string is recorded on every case.
version: "2026.11.3"

symptom_groups:
  offline:
    label: "Camera 'offline' (ambiguous)"
    alternatives: [discovery_failure, control_failure, frame_loss, trigger_missing, dashboard_stale, camera_resets]
  missing_images:
    label: "Images missing / cartons diverted"
    alternatives: [frame_loss, trigger_missing, control_failure]
  cannot_connect:
    label: "Visible but cannot connect"
    alternatives: [control_failure, discovery_failure]
  intermittent_disconnect:
    label: "Disconnects intermittently"
    alternatives: [control_failure, camera_resets, discovery_failure]
  dashboard:
    label: "Dashboard shows station offline"
    alternatives: [dashboard_stale]
  image_quality:
    label: "Images look wrong"
    alternatives: [image_quality, frame_loss]

diagnostics:
  - {id: D-DISC, tool: discovery_scan, title: "Discovery scan (GVCP broadcast)", produces: [discovery], effort: 0, disruption: 0}
  - {id: D-CTRL, tool: control_probe, title: "Open/release each control channel", produces: [control], effort: 0, disruption: 0}
  - {id: D-VER, tool: compare_versions, title: "Compare versions against compatibility matrix and known issues", produces: [versions], effort: 0, disruption: 0}
  - {id: D-STREAM-PROD, tool: inspect_acquisition_stats, args: {mode: production}, title: "Production acquisition statistics (all cameras, last 60 s)", produces: [stream.production], effort: 0, disruption: 0}
  - {id: D-STREAM-LOW, tool: inspect_acquisition_stats, args: {mode: low}, title: "Low-speed acquisition statistics (weekend run history)", produces: [stream.low], effort: 0, disruption: 0}
  - {id: D-STREAM-SINGLE, tool: inspect_acquisition_stats, args: {mode: single}, title: "Acquire each camera alone at production trigger rate", produces: [stream.single], effort: 1, disruption: 2, requires: [D-STREAM-PROD], needs_test_window: true}
  - {id: D-TOPO, tool: inspect_topology, title: "Switch port, PoE and uplink counters", produces: [topology], effort: 0, disruption: 0}
  - {id: D-HOST, tool: inspect_host, title: "Edge host resources, drivers and settings", produces: [host], effort: 0, disruption: 0}
  - {id: D-PLC, tool: inspect_plc_link, title: "PLC trigger / result handshake counters", produces: [plc], effort: 0, disruption: 0}
  - {id: D-MGMT, tool: inspect_management, title: "Station-management link (MQTT/TLS) and dashboard freshness", produces: [mgmt], effort: 0, disruption: 0}
  - {id: D-EVENTS, tool: correlate_events, args: {window_h: 48}, title: "Correlate host, camera, switch and agent events (48 h)", produces: [events], effort: 0, disruption: 0}
  - {id: D-TECH-VIEWER, tool: request_observation, args: {question: viewer_single}, device_from: mentioned_device, title: "Ask technician: does the vendor viewer acquire this camera alone?", produces: [tech.viewer_single], effort: 3, disruption: 1, requires_technician: true}
  - {id: D-TECH-SUBST, tool: request_observation, args: {question: substitution}, device_from: suspect_physical_device, title: "Ask technician: controlled cable/port substitution", produces: [tech.substitution], effort: 5, disruption: 2, requires_technician: true, requires: [D-TOPO]}
  - {id: D-TECH-IDLE, tool: request_observation, args: {question: idle_pattern}, title: "Ask technician: does it follow idle periods?", produces: [tech.idle_pattern], effort: 1, disruption: 0, requires_technician: true}
  - {id: D-TECH-CHANGES, tool: request_observation, args: {question: recent_changes}, title: "Ask technician: what changed and when did it last work?", produces: [tech.recent_changes], effort: 1, disruption: 0, requires_technician: true}

hypotheses:
  - id: H-BURST
    title: "Synchronous camera bursts overflow the switch uplink buffer"
    family: network_and_configuration
    severity: 4
    triggers: [frame_loss]
    explains: [frame_loss]
    support:
      - {fact: single_all_clean, op: is_true, why: "every camera is clean when acquired alone"}
      - {fact: uplink_egress_drops, op: gt, value: 0, why: "switch uplink egress drops during bursts"}
      - {fact: prod_resends_total, op: gt, value: 0, why: "host is requesting packet resends"}
      - {fact: low_usable_pct, op: gte, value: 99.5, why: "same configuration is usable at low line speed"}
    contradict:
      - {fact: crc_cams, op: nonempty, why: "CRC errors point at a physical link instead (re-check after physical fix)"}
    playbook: PB-PACING
    disposition: known_playbook
    sources: [S1, S5]

  - id: H-HOST-BACKPRESSURE
    title: "Host application cannot keep up (image pool exhausted)"
    family: application_defect
    severity: 3
    triggers: [frame_loss]
    explains: [frame_loss]
    support:
      - {fact: app_drop_pct, op: gt, value: 1, why: "frames dropped inside the application"}
      - {fact: host_backpressure_config, op: is_true, why: "debug image archive enabled or image pool undersized"}
    contradict:
      - {fact: host_perm_errors, op: is_true, why: "driver permission fallback explains host load"}
    playbook: PB-HOST-BUFFERS
    disposition: known_playbook
    sources: [S5]

  - id: H-PERM
    title: "Service user lacks permission for the acquisition filter driver (Linux)"
    family: identity_permissions
    severity: 3
    triggers: [frame_loss]
    explains: [frame_loss]
    support:
      - {fact: host_perm_errors, op: is_true, why: "permission denied opening the filter-driver device"}
      - {fact: linux_host, op: is_true, why: "Linux host"}
    playbook: PB-PERM
    disposition: known_playbook
    sources: []

  - id: H-CABLE
    title: "Damaged cable or connector on one camera link"
    family: physical
    severity: 4
    triggers: [frame_loss, camera_resets]
    explains: [frame_loss, camera_resets]
    support:
      - {fact: crc_cams, op: nonempty, why: "CRC errors on a camera port"}
      - {fact: single_bad_cams, op: nonempty, why: "loss persists when the camera runs alone"}
      - {fact: substitution_result, op: eq, value: fault_follows_cable, why: "controlled substitution: fault followed the cable"}
    contradict:
      - {fact: substitution_result, op: eq, value: fault_follows_camera, why: "fault followed the camera, not the cable"}
    disposition: field_service
    sources: []

  - id: H-CAMERA-HW
    title: "Camera hardware fault (spontaneous resets)"
    family: physical
    severity: 5
    triggers: [camera_resets, discovery_failure]
    explains: [camera_resets, discovery_failure, control_failure, frame_loss]
    support:
      - {fact: reboot_cams, op: nonempty, why: "camera uptime counter restarted"}
      - {fact: poe_over_budget, op: is_false, why: "PoE budget is not exceeded"}
      - {fact: substitution_result, op: eq, value: fault_follows_camera, why: "controlled substitution: fault followed the camera"}
    contradict:
      - {fact: substitution_result, op: eq, value: fault_follows_cable, why: "fault followed the cable"}
    disposition: field_service
    sources: []

  - id: H-POE
    title: "PoE power budget exceeded on the replacement switch"
    family: network_and_configuration
    severity: 4
    triggers: [camera_resets, control_failure, discovery_failure]
    explains: [camera_resets, control_failure, discovery_failure, frame_loss]
    support:
      - {fact: poe_over_budget, op: is_true, why: "PoE draw exceeds switch budget"}
      - {fact: poe_denied_event, op: is_true, why: "switch logged power denial"}
    playbook: PB-POE
    disposition: known_playbook
    sources: []

  - id: H-ADAPTER
    title: "Installed camera adapter does not match camera firmware"
    family: interoperability_version
    severity: 3
    triggers: [control_failure]
    explains: [control_failure, frame_loss]
    support:
      - {fact: discovery_all_found, op: is_true, why: "camera answers discovery, so the network path to it works"}
      - {fact: control_adapter_missing_cams, op: nonempty, why: "control channel refused: no matching adapter"}
      - {fact: adapter_missing_cams, op: nonempty, why: "compatibility matrix: required adapter not installed"}
    contradict:
      - {fact: unreleased_fw_cams, op: nonempty, why: "firmware is outside the released matrix"}
    playbook: PB-ADAPTER
    disposition: known_playbook
    sources: [S2]

  - id: H-UNRELEASED-FW
    title: "Camera runs firmware outside the released compatibility matrix"
    family: interoperability_version
    severity: 4
    triggers: [control_failure]
    explains: [control_failure, frame_loss]
    support:
      - {fact: unreleased_fw_cams, op: nonempty, why: "firmware not in released list"}
    disposition: engineering_escalation
    handoff_requires: [versions, discovery]
    sources: [S2]

  - id: H-SUBNET
    title: "Camera has no persistent IP in the station subnet"
    family: network_and_configuration
    severity: 2
    triggers: [control_failure]
    explains: [control_failure, frame_loss]
    support:
      - {fact: subnet_mismatch_cams, op: nonempty, why: "discovered with link-local address outside host subnet"}
    playbook: PB-IP
    disposition: known_playbook
    sources: []

  - id: H-STALE-LOCK
    title: "Control privilege retained after an application crash (heartbeat not yet expired)"
    family: identity_permissions
    severity: 3
    triggers: [control_failure]
    explains: [control_failure, frame_loss]
    tags: [restart_mitigation]
    support:
      - {fact: crash_then_lock, op: is_true, why: "application crash followed by 'already controlled' on restart"}
      - {fact: sdk_lock_retention_issue, op: is_true, why: "SDK version and debug-heartbeat setting are inside the documented scope"}
    playbook: PB-RELEASE-LOCK
    disposition: known_playbook
    sources: [S3]

  - id: H-HEARTBEAT-GAP
    title: "Heartbeat gap after idle causes cameras to refuse control (no confirmed root cause)"
    family: application_defect
    severity: 4
    triggers: [control_failure]
    explains: [control_failure, frame_loss]
    tags: [restart_mitigation]
    support:
      - {fact: heartbeat_denied_after_gap, op: gt, value: 0, why: "heartbeat ACK ACCESS_DENIED after a gap longer than the timeout"}
      - {fact: crash_then_lock, op: is_false, why: "no application crash preceded the lockout"}
    corroborate:
      - {fact: idle_pattern, op: eq, value: after_idle, why: "technician links it to idle periods"}
      - {fact: host_migrated, op: is_true, why: "host was recently migrated"}
    disposition: engineering_escalation
    handoff_requires: [versions, host, tech.idle_pattern, topology]
    alternatives:
      - "Heartbeat thread starvation on the new host (timer resolution / power plan)"
      - "NIC power-saving or energy-efficient Ethernet delaying GVCP packets after idle"
      - "SDK polling interval interacting with the 3 s heartbeat timeout"
      - "Switch or firewall behaviour after idle (less likely: affects all four cameras at once)"
    sources: [S6, S3]

  - id: H-TRAILER
    title: "Talon camera needs the documented trailer-handling setting"
    family: interoperability_version
    severity: 3
    triggers: [frame_loss]
    explains: [frame_loss]
    support:
      - {fact: payload_invalid_cams, op: nonempty, why: "frames rejected as invalid payload"}
      - {fact: talon_trailer_not_ignored, op: is_true, why: "Talon device without its scoped setting"}
      - {fact: known_issue_ids, op: contains, value: KI-TALON-TRAILER, why: "known issue matches vendor/model"}
    playbook: PB-TRAILER
    disposition: known_playbook
    sources: [S4]

  - id: H-TRAILER-MISAPPLIED
    title: "Trailer workaround applied to cameras outside its scope"
    family: network_and_configuration
    severity: 3
    triggers: [frame_loss]
    explains: [frame_loss]
    support:
      - {fact: payload_invalid_cams, op: nonempty, why: "frames rejected as invalid payload"}
      - {fact: trailer_ignored_on_non_talon, op: is_true, why: "vendor-specific setting enabled on other vendors' cameras"}
    playbook: PB-TRAILER
    disposition: known_playbook
    sources: [S4]

  - id: H-FW-DEFECT
    title: "Known firmware defect on this exact model and revision"
    family: firmware_defect
    severity: 4
    triggers: [frame_loss]
    explains: [frame_loss]
    support:
      - {fact: acq_start_failed_cams, op: nonempty, why: "acquisition fails to start"}
      - {fact: known_issue_ids, op: contains, value: KI-TALON-FW-271, why: "known issue matches model and firmware"}
    playbook: PB-FW-UPDATE
    disposition: known_playbook
    sources: [S4]

  - id: H-LOCALE
    title: "Register writes rejected because of a decimal-comma locale"
    family: interoperability_version
    severity: 2
    triggers: [control_failure, frame_loss]
    explains: [control_failure, frame_loss]
    support:
      - {fact: register_write_cams, op: nonempty, why: "control opens but float register writes fail"}
      - {fact: locale_comma, op: is_true, why: "service locale uses a decimal comma"}
    playbook: PB-LOCALE
    disposition: known_playbook
    sources: [S5]

  - id: H-PLC-TRIGGER
    title: "PLC triggers not reaching a camera (I/O mapping on new host)"
    family: network_and_configuration
    severity: 3
    triggers: [trigger_missing, frame_loss]
    explains: [trigger_missing, frame_loss]
    support:
      - {fact: trigger_missing_cams, op: nonempty, why: "PLC sends triggers but no frames start"}
      - {fact: control_all_ok, op: is_true, why: "camera control path is healthy"}
    playbook: PB-TRIGGER
    disposition: known_playbook
    sources: []

  - id: H-MGMT-CERT
    title: "Management-service client certificate expired (dashboard stale)"
    family: identity_permissions
    severity: 2
    triggers: [dashboard_stale]
    explains: [dashboard_stale]
    support:
      - {fact: mgmt_tls_expired, op: is_true, why: "broker rejected an expired client certificate"}
      - {fact: local_acq_running, op: is_true, why: "acquisition is running locally"}
    playbook: PB-CERT
    disposition: known_playbook
    sources: []

  - id: H-MGMT-IDENTITY
    title: "Replacement host not enrolled with the plant broker"
    family: identity_permissions
    severity: 2
    triggers: [dashboard_stale]
    explains: [dashboard_stale]
    support:
      - {fact: mgmt_identity_rejected, op: is_true, why: "broker rejected the client identity"}
      - {fact: local_acq_running, op: is_true, why: "acquisition is running locally"}
    playbook: PB-REENROLL
    disposition: known_playbook
    sources: []

playbooks:
  - id: PB-PACING
    title: "Pace camera transmission so bursts fit the uplink"
    scope: "Cameras sharing one switch uplink; requires a customer-approved change window."
    allowed_actions: [set_transport, set_line_rate]
    option_generator: transport_pacing
    verify: [production_usable, deadline, line_rate, control_all_ok, plc_results_ok]
    rollback: "Previous camera transport profile is saved before writing and can be restored."
    sources: [S1, S5]
  - id: PB-ADAPTER
    title: "Install the adapter that matches the camera firmware"
    scope: "Vireo cameras whose firmware line has a released adapter."
    allowed_actions: [install_adapter, change_firmware]
    option_generator: adapter_match
    verify: [control_all_ok, single_ok, production_usable, plc_results_ok]
    rollback: "Uninstall the added adapter; existing adapters are untouched."
    sources: [S2]
  - id: PB-IP
    title: "Write a persistent IP inside the station subnet"
    scope: "Cameras discovered with a link-local or foreign address."
    allowed_actions: [set_persistent_ip]
    option_generator: persistent_ip
    verify: [control_all_ok, production_usable]
    rollback: "Restore previous IP configuration."
    sources: []
  - id: PB-RELEASE-LOCK
    title: "Release retained control, then remove the debug heartbeat extension"
    scope: "Kestrel SDK < 3.0 with debug heartbeat extension (documented scope only)."
    allowed_actions: [release_control, disable_debug_heartbeat]
    option_generator: static
    options:
      - {id: O-REMOVE-DEBUG-HB, title: "Remove debug heartbeat extension from production profile, then reconnect", action: disable_debug_heartbeat, params: {}, tradeoff: "Addresses the documented mechanism; debugging sessions must use a separate profile.", meets_requirements: true}
      - {id: O-POWER-CYCLE, title: "Power-cycle camera ports to release control (temporary)", action: release_control, params: {}, tradeoff: "Temporary: the lock returns after the next crash.", meets_requirements: false}
    verify: [control_all_ok, production_usable, crash_recovery]
    rollback: "Restore previous profile."
    sources: [S3]
  - id: PB-TRAILER
    title: "Apply the trailer setting to the Talon device only"
    scope: "Harrier Optics Talon TX-12C only. Never applied station-wide."
    allowed_actions: [set_ignore_trailer]
    option_generator: trailer_scope
    verify: [production_usable, control_all_ok]
    rollback: "Restore previous per-device transport settings."
    sources: [S4]
  - id: PB-FW-UPDATE
    title: "Update to the approved firmware revision"
    scope: "Only transitions listed in approved_firmware_changes."
    allowed_actions: [change_firmware]
    option_generator: firmware_update
    verify: [control_all_ok, production_usable]
    rollback: "Firmware rollback requires field service."
    sources: [S4]
  - id: PB-LOCALE
    title: "Run the acquisition service with an en-US number format"
    scope: "Hosts with a decimal-comma locale."
    allowed_actions: [set_locale]
    option_generator: static
    options:
      - {id: O-LOCALE, title: "Set service account number format to en-US", action: set_locale, params: {}, tradeoff: "Operator UI locale unchanged.", meets_requirements: true}
    verify: [control_all_ok, production_usable]
    rollback: "Restore locale."
    sources: [S5]
  - id: PB-HOST-BUFFERS
    title: "Restore image pool and disable debug image archive"
    scope: "Edge hosts with application-level image drops."
    allowed_actions: [host_buffers]
    option_generator: static
    options:
      - {id: O-HOST-BUFFERS, title: "Raise image pool to 64 frames; disable debug image archive", action: host_buffers, params: {}, tradeoff: "Debug images no longer archived on the host.", meets_requirements: true}
    verify: [production_usable, deadline]
    rollback: "Restore previous application settings."
    sources: [S5]
  - id: PB-PERM
    title: "Grant the service user access to the filter driver"
    scope: "Linux hosts."
    allowed_actions: [fix_permission]
    option_generator: static
    options:
      - {id: O-UDEV, title: "Install udev rule and add service user to the driver group", action: fix_permission, params: {}, tradeoff: "Requires service restart.", meets_requirements: true}
    verify: [production_usable]
    rollback: "Remove udev rule."
    sources: []
  - id: PB-TRIGGER
    title: "Restore trigger I/O mapping from the line profile"
    scope: "Edge host replacement with lost I/O mapping."
    allowed_actions: [restore_trigger_map]
    option_generator: static
    options:
      - {id: O-TRIGGER-MAP, title: "Restore I/O mapping from saved Line profile", action: restore_trigger_map, params: {}, tradeoff: "Line must be stopped for 2 minutes.", meets_requirements: true}
    verify: [plc_results_ok, production_usable]
    rollback: "Restore previous mapping."
    sources: []
  - id: PB-CERT
    title: "Renew the management client certificate"
    scope: "Station agent with expired client certificate."
    allowed_actions: [renew_cert]
    option_generator: static
    options:
      - {id: O-RENEW, title: "Renew certificate through the plant enrollment service", action: renew_cert, params: {}, tradeoff: "No production impact.", meets_requirements: true}
    verify: [dashboard_fresh]
    rollback: "n/a"
    sources: []
  - id: PB-REENROLL
    title: "Enroll the replacement host with the plant broker"
    scope: "Replacement edge host with new identity."
    allowed_actions: [reenroll]
    option_generator: static
    options:
      - {id: O-REENROLL, title: "Enroll new host identity (plant IT approval)", action: reenroll, params: {}, tradeoff: "Needs plant IT approval.", meets_requirements: true}
    verify: [dashboard_fresh]
    rollback: "Revoke new enrollment."
    sources: []
  - id: PB-POE
    title: "Configure PoE power mode / priority for camera heaters"
    scope: "Replacement switch with lower PoE budget."
    allowed_actions: [poe_priority]
    option_generator: static
    options:
      - {id: O-POE, title: "Enable PoE power-mode with camera ports at high priority", action: poe_priority, params: {}, tradeoff: "Non-camera PoE devices lose priority.", meets_requirements: true}
    verify: [control_all_ok, no_resets, production_usable]
    rollback: "Restore switch PoE settings."
    sources: []

limits:
  max_automated_checks: 10
  max_technician_questions: 3
  max_interventions: 3
