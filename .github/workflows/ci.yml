name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Reproducible evaluation (no provider credentials)
        run: python -m linesight.eval.run --modes checklist,rules,replay --out eval.json
      - uses: actions/upload-artifact@v4
        with: { name: eval-results, path: eval.json }

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -e .
      - name: Regenerate static replays and evaluation data
        run: |
          python -m linesight.export_static frontend/public/data
          python -m linesight.eval.run --modes checklist,rules,replay --out frontend/public/data/eval.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: { CI: "1" }
